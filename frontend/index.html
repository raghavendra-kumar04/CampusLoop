    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Structured Data: JSON-LD for WebSite and Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://campusloop-nine.vercel.app/#website",
          "url": "https://campusloop-nine.vercel.app/",
          "name": "CampusLoop",
          "description": "Student Marketplace for College Communities",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://campusloop-nine.vercel.app/marketplace?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          },
          "inLanguage": "en-US"
        },
        {
          "@type": "Organization",
          "@id": "https://campusloop-nine.vercel.app/#organization",
          "name": "CampusLoop",
          "url": "https://campusloop-nine.vercel.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://campusloop-nine.vercel.app/logo.png",
            "width": 512,
            "height": 512,
            "caption": "CampusLoop Logo"
          },
          "description": "Student-exclusive peer-to-peer university marketplace platform.",
          "email": "admin@campusloop.org"
        }
      ]
    }
    </script>

    <!-- Instant Zero-FOUC Theme Initializer -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('campusloop-theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
